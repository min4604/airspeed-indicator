<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>空速監控儀表板</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { 
      --bg:#0f172a; 
      --panel:#1e293b; 
      --panel-dark:#111827;
      --text:#e5e7eb; 
      --muted:#94a3b8; 
      --accent:#38bdf8;
      --accent-hover:#0ea5e9;
      --border:#334155;
      --success:#10b981;
      --warning:#f59e0b;
    }
    
    * { box-sizing: border-box; }
    
    html,body { 
      margin:0; 
      min-height:100vh; 
      background:var(--bg); 
      color:var(--text); 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    
    header { 
      padding: 20px 24px; 
      font-size: 24px;
      font-weight: 700; 
      letter-spacing: -0.5px; 
      background: linear-gradient(135deg, #0b1220 0%, #1e293b 100%);
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    main { 
      padding: 24px; 
      max-width: 1600px; 
      margin: 0 auto; 
    }
    
    .cards { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
      gap: 16px; 
      margin-bottom: 24px; 
    }
    
    .card { 
      background: var(--panel); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 20px 24px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      border-color: var(--accent);
    }
    
    .label { 
      font-size: 13px; 
      font-weight: 600;
      color: var(--muted); 
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .value { 
      font-size: 36px; 
      font-weight: 800; 
      color: #f1f5f9;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    
    .unit { 
      font-size: 16px; 
      color: var(--muted); 
      margin-left: 8px;
      font-weight: 500;
    }
    
    .chart-container {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
    }
    
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .chart-title {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
    }
    
    .chart-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .control-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }
    
    canvas { 
      background: var(--panel-dark); 
      border: 1px solid var(--border); 
      border-radius: 8px;
      width: 100% !important;
      height: auto !important;
    }
    
    select, input[type="number"] {
      background: var(--panel-dark);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    select:hover, input[type="number"]:hover {
      border-color: var(--accent);
    }
    
    select:focus, input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
    }
    
    .settings-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
    }
    
    .settings-title {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 16px;
    }
    
    .settings-section {
      margin-bottom: 20px;
    }
    
    .settings-section:last-child {
      margin-bottom: 0;
    }
    
    .settings-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 12px;
      display: block;
    }
    
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .radio-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 6px;
      transition: background 0.2s ease;
      cursor: pointer;
    }
    
    .radio-option:hover {
      background: var(--panel-dark);
    }
    
    input[type="radio"] {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .radio-label {
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      flex: 1;
    }
    
    .status-box {
      background: var(--panel-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
    }
    
    .status-text {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
    }
    
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
    
    .footer { 
      color: #64748b; 
      font-size: 12px; 
      margin-top: 16px; 
      text-align: right; 
    }
    
    /* Responsive adjustments */
    @media (max-width: 768px) {
      header {
        font-size: 20px;
        padding: 16px 20px;
      }
      
      .value {
        font-size: 28px;
      }
      
      .cards {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      
      .chart-controls {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <span class="status-indicator"></span>
      空速監控儀表板
    </div>
  </header>
  <main>
    <div class="cards">
      <div class="card">
        <div class="label">
          即時空速
          <select id="airspeed-type">
            <option value="IAS">IAS</option>
            <option value="CAS">CAS</option>
            <option value="TAS" selected>TAS</option>
          </select>
        </div>
        <div class="value" id="v-airspeed">--<span class="unit">km/h</span></div>
      </div>
      <div class="card">
        <div class="label">差壓轉換</div>
        <div class="value" id="v-airspeed-ms">--<span class="unit">m/s</span></div>
      </div>
      <div class="card">
        <div class="label">
          環境溫度
          <select id="temp-source">
            <option value="PADS">PADS</option>
            <option value="HIDS">HIDS</option>
            <option value="PDUS">PDUS</option>
          </select>
        </div>
        <div class="value" id="v-temp">--<span class="unit">°C</span></div>
      </div>
      <div class="card">
        <div class="label">相對濕度</div>
        <div class="value" id="v-hum">--<span class="unit">%</span></div>
      </div>
      <div class="card">
        <div class="label">靜壓</div>
        <div class="value" id="v-press">--<span class="unit">kPa</span></div>
      </div>
    </div>

    <!-- QNH Altimeter Setting Section -->
    <div class="chart-container" style="margin-bottom: 24px;">
      <div class="chart-header">
        <div class="chart-title">高度表修正設定 (QNH)</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 10px 0;">
        <div>
          <label class="settings-label" style="margin-bottom: 8px; display: block;">
            修正海平面氣壓 (QNH)
          </label>
          <div style="display: flex; gap: 12px; align-items: center;">
            <input 
              type="number" 
              id="qnh-pressure" 
              step="0.1" 
              min="900" 
              max="1100" 
              value="1013.25"
              style="flex: 1; padding: 10px 14px; font-size: 16px; font-weight: 600;"
              placeholder="1013.25"
            />
            <select id="qnh-unit" style="padding: 10px 14px; font-size: 14px;">
              <option value="hPa">hPa</option>
              <option value="inHg">inHg</option>
            </select>
            <button 
              id="apply-qnh" 
              style="padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s;"
              onmouseover="this.style.background='var(--accent-hover)'"
              onmouseout="this.style.background='var(--accent)'"
            >
              套用
            </button>
          </div>
          <div style="margin-top: 8px; font-size: 12px; color: var(--muted);">
            標準海平面氣壓: 1013.25 hPa (29.92 inHg)
          </div>
        </div>
        <div>
          <label class="settings-label" style="margin-bottom: 8px; display: block;">
            修正後的高度 (QNH Altitude)
            <select id="altitude-unit" style="margin-left: 12px; padding: 6px 10px;">
              <option value="m">公尺 (m)</option>
              <option value="ft">英呎 (ft)</option>
            </select>
          </label>
          <div style="background: var(--panel-dark); border: 1px solid var(--border); border-radius: 8px; padding: 16px;">
            <div style="font-size: 32px; font-weight: 800; color: #10b981;" id="qnh-altitude">
              --<span style="font-size: 16px; color: var(--muted); margin-left: 8px;" id="qnh-altitude-unit">m</span>
            </div>
            <div style="margin-top: 4px; font-size: 12px; color: var(--muted);">
              基於 QNH 修正的氣壓高度
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="chart-container">
      <div class="chart-header">
        <div class="chart-title">即時空速趨勢圖</div>
        <div class="chart-controls">
          <div class="control-group">
            <span class="control-label">時間範圍:</span>
            <select id="time-range">
              <option value="60">60 點</option>
              <option value="120">120 點</option>
              <option value="300" selected>300 點</option>
              <option value="600">600 點</option>
              <option value="1800">1800 點</option>
            </select>
          </div>
          <div class="control-group">
            <span class="control-label">橫軸刻度間隔:</span>
            <select id="x-axis-ticks">
              <option value="5">每 5 點</option>
              <option value="10">每 10 點</option>
              <option value="20" selected>每 20 點</option>
              <option value="30">每 30 點</option>
              <option value="60">每 60 點</option>
            </select>
          </div>
        </div>
      </div>
      <div style="position: relative; height: 500px;">
        <canvas id="chart"></canvas>
      </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel">
      <div class="settings-title">系統設定</div>
      
      <div class="settings-section">
        <label class="settings-label">資料更新模式</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="update-mode" value="stream" checked>
            <span class="radio-label">
              <strong>即時推送 (推薦)</strong><br>
              <small style="color: var(--muted);">後台有新資料時立即更新，延遲最低</small>
            </span>
          </label>
          <label class="radio-option">
            <input type="radio" name="update-mode" value="poll">
            <span class="radio-label">
              <strong>定時輪詢</strong>
              <select id="update-rate" style="margin-left: 12px;" disabled>
                <option value="250">0.25 秒</option>
                <option value="500">0.5 秒</option>
                <option value="1000" selected>1 秒</option>
                <option value="2000">2 秒</option>
                <option value="5000">5 秒</option>
              </select>
            </span>
          </label>
        </div>
      </div>

      <div class="status-box">
        <div class="status-text" id="status">等待資料...</div>
        <div class="footer">資料來源：本機 Tkinter 後台（即時串流）</div>
      </div>
    </div>
  </main>

  <script>
    const el = (id) => document.getElementById(id);
    let maxPoints = 300; // Default: 5 minutes @ 1Hz
    let qnhPressure = 1013.25; // Default QNH in hPa
    let currentPressureKpa = null; // Current measured pressure
    let currentAltitudeData = null; // Current altitude data

    const ctx = document.getElementById('chart');
    const data = {
      labels: [],
      datasets: [{
        label: 'Airspeed (km/h)',
        data: [],
        borderColor: '#38bdf8',
        backgroundColor: 'rgba(56,189,248,0.15)',
        tension: 0.3,
        borderWidth: 3,
        pointRadius: 0,
        fill: true
      }]
    };
    const chart = new Chart(ctx, {
      type: 'line',
      data,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: {
          duration: 0 // Disable animation for better performance
        },
        scales: {
          x: { 
            ticks: { 
              color: '#94a3b8',
              font: { size: 12, weight: '500' },
              maxRotation: 45,
              minRotation: 0,
              autoSkip: true,
              autoSkipPadding: 10,
              maxTicksLimit: 20
            },
            grid: {
              color: 'rgba(148,163,184,0.1)',
              drawBorder: false
            },
            title: {
              display: true,
              text: '時間',
              color: '#cbd5e1',
              font: { size: 13, weight: '600' }
            }
          },
          y: { 
            beginAtZero: true,
            min: 0,
            ticks: { 
              color: '#94a3b8',
              font: { size: 12, weight: '500' },
              
            },
            grid: { 
              color: 'rgba(148,163,184,0.15)',
              drawBorder: false
            },
            title: {
              display: true,
              text: '空速 (km/h)',
              color: '#cbd5e1',
              font: { size: 13, weight: '600' }
            }
          }
        },
        plugins: {
          legend: { 
            labels: { 
              color: '#cbd5e1',
              font: { size: 14, weight: '600' },
              padding: 15
            }
          },
          tooltip: {
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            titleColor: '#f1f5f9',
            bodyColor: '#e2e8f0',
            borderColor: '#38bdf8',
            borderWidth: 1,
            padding: 12,
            displayColors: true,
            callbacks: {
              label: function(context) {
                return context.dataset.label + ': ' + context.parsed.y.toFixed(2) + ' km/h';
              }
            }
          }
        },
        interaction: {
          mode: 'index',
          intersect: false
        }
      }
    });

    function updateChartLabel() {
      const type = el('airspeed-type').value;
      const labels = {
        IAS: 'IAS 指示空速 (km/h)', 
        CAS: 'CAS 校準空速 (km/h)', 
        TAS: 'TAS 真實空速 (km/h)'
      };
      data.datasets[0].label = labels[type] || 'Airspeed (km/h)';
      chart.options.scales.y.title.text = labels[type] || 'Airspeed (km/h)';
      chart.update('none');
    }
    
    function updateChartXAxisTicks() {
      const tickInterval = parseInt(el('x-axis-ticks').value) || 20;
      chart.options.scales.x.ticks.autoSkip = true;
      chart.options.scales.x.ticks.maxTicksLimit = Math.max(5, Math.floor(maxPoints / tickInterval));
      chart.update('none');
    }
    
    function updateTimeRange() {
      maxPoints = parseInt(el('time-range').value) || 300;
      // Trim data if needed
      while (data.labels.length > maxPoints) {
        data.labels.shift();
        data.datasets[0].data.shift();
      }
      updateChartXAxisTicks();
      chart.update('none');
    }
    
    // QNH Calculation Functions
    function calculateQNHAltitude(pressureKpa, qnhHpa, temperatureC = 15.0) {
      // Convert QNH from hPa to Pa
      const qnhPa = qnhHpa * 100.0;
      const pressurePa = pressureKpa * 1000.0;
      
      // ISA constants
      const T0 = 288.15;  // Sea level standard temperature in K (15°C)
      const L = -0.0065;  // Temperature lapse rate in K/m
      const g = 9.80665;  // Gravitational acceleration in m/s²
      const R = 287.05;   // Specific gas constant for dry air in J/(kg·K)
      
      // Calculate altitude relative to QNH
      const exponent = -(R * L) / g;
      const pressureRatio = pressurePa / qnhPa;
      
      if (pressureRatio > 0) {
        const altitudeM = (T0 / L) * (Math.pow(pressureRatio, exponent) - 1);
        const altitudeFt = altitudeM * 3.28084;
        
        return {
          altitude_m: altitudeM,
          altitude_ft: altitudeFt,
          qnh_hpa: qnhHpa,
          pressure_kpa: pressureKpa
        };
      }
      
      return {
        altitude_m: 0,
        altitude_ft: 0,
        qnh_hpa: qnhHpa,
        pressure_kpa: pressureKpa
      };
    }
    
    function updateQNHDisplay() {
      if (currentPressureKpa === null) return;
      
      const qnhAltitude = calculateQNHAltitude(currentPressureKpa, qnhPressure);
      const altUnit = el('altitude-unit').value;
      
      if (altUnit === 'm') {
        el('qnh-altitude').innerHTML = `${qnhAltitude.altitude_m.toFixed(1)}<span style="font-size: 16px; color: var(--muted); margin-left: 8px;">m</span>`;
      } else {
        el('qnh-altitude').innerHTML = `${qnhAltitude.altitude_ft.toFixed(1)}<span style="font-size: 16px; color: var(--muted); margin-left: 8px;">ft</span>`;
      }
    }
    
    function applyQNH() {
      const qnhValue = parseFloat(el('qnh-pressure').value);
      const qnhUnit = el('qnh-unit').value;
      
      if (isNaN(qnhValue) || qnhValue < 900 || qnhValue > 1100) {
        alert('請輸入有效的氣壓值 (900-1100 hPa 或等效 inHg)');
        return;
      }
      
      // Convert inHg to hPa if needed
      if (qnhUnit === 'inHg') {
        qnhPressure = qnhValue * 33.8639; // 1 inHg = 33.8639 hPa
      } else {
        qnhPressure = qnhValue;
      }
      
      updateQNHDisplay();
      el('status').textContent = `QNH 已更新為 ${qnhPressure.toFixed(2)} hPa`;
      
      // Send QNH to backend
      sendQNHToBackend(qnhPressure);
    }
    
    async function sendQNHToBackend(qnhHpa) {
      try {
        const response = await fetch('/api/set_qnh', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            qnh_hpa: qnhHpa
          })
        });
        
        if (response.ok) {
          console.log('QNH sent to backend successfully');
        }
      } catch (error) {
        console.error('Failed to send QNH to backend:', error);
      }
    }
    
    // Unit conversion for QNH input
    el('qnh-unit').addEventListener('change', () => {
      const currentValue = parseFloat(el('qnh-pressure').value);
      const newUnit = el('qnh-unit').value;
      
      if (!isNaN(currentValue)) {
        if (newUnit === 'inHg') {
          // Convert hPa to inHg
          el('qnh-pressure').value = (currentValue / 33.8639).toFixed(2);
          el('qnh-pressure').step = '0.01';
        } else {
          // Convert inHg to hPa
          el('qnh-pressure').value = (currentValue * 33.8639).toFixed(2);
          el('qnh-pressure').step = '0.1';
        }
      }
    });

    function pushPoint(ts, kmh){
      const dt = new Date(ts * 1000);
      const label = dt.toLocaleTimeString();
      data.labels.push(label);
      data.datasets[0].data.push(kmh);
      if (data.labels.length > maxPoints) {
        data.labels.shift();
        data.datasets[0].data.shift();
      }
      chart.update('none');
    }

    async function loadSeries(){
      try {
        const r = await fetch('/api/series');
        const arr = await r.json();
        data.labels.length = 0; data.datasets[0].data.length = 0;
        const type = el('airspeed-type').value;
        for (const p of arr) {
          if (p && typeof p.t === 'number') {
            const kmhKey = `${type}_kmh`;
            const kmh = Number(p[kmhKey]) || 0;
            pushPoint(p.t, kmh);
          }
        }
        if (arr.length) el('status').textContent = `載入歷史資料 ${arr.length} 筆`; else el('status').textContent = '尚無歷史資料';
      } catch(e){
        el('status').textContent = '無法載入歷史資料';
      }
    }

    async function pollLive(){
      try {
        const r = await fetch('/api/live');
        const j = await r.json();
        if (j.status === 'no-data') {
          el('status').textContent = '等待資料...';
          return;
        }
        const ts = j.timestamp || (Date.now()/1000);
        
        // Airspeed type selection
        const airspeedType = el('airspeed-type').value;
        const kmh = Number(j[`${airspeedType}_kmh`]) || 0;
        const ms = Number(j[`${airspeedType}_ms`]) || 0;
        
        pushPoint(ts, kmh);
        el('v-airspeed').innerHTML = `${kmh.toFixed(2)}<span class="unit"> km/h</span>`;
        el('v-airspeed-ms').innerHTML = `${ms.toFixed(2)}<span class="unit"> m/s</span>`;
        
        // Temperature source selection
        const tempSource = el('temp-source').value;
        let tempVal = null;
        if (tempSource === 'PADS') tempVal = j.temperature_PADS;
        else if (tempSource === 'HIDS') tempVal = j.temperature_HIDS;
        else if (tempSource === 'PDUS') tempVal = j.temperature_PDUS;
        
        if (tempVal != null) el('v-temp').innerHTML = `${Number(tempVal).toFixed(2)}<span class="unit"> °C</span>`;
        else el('v-temp').innerHTML = `--<span class="unit"> °C</span>`;
        
        if (j.humidity_percent != null) el('v-hum').innerHTML = `${Number(j.humidity_percent).toFixed(1)}<span class="unit"> %</span>`;
        if (j.pressure_kpa != null) {
          el('v-press').innerHTML = `${Number(j.pressure_kpa).toFixed(2)}<span class="unit"> kPa</span>`;
          currentPressureKpa = Number(j.pressure_kpa);
          updateQNHDisplay();
        }
        
        el('status').textContent = '連線正常';
      } catch(e) {
        el('status').textContent = '連線中斷或尚未啟動';
      }
    }

    function updateDisplay(j) {
      if (!j) return;
      const ts = j.timestamp || (Date.now()/1000);
      
      // Airspeed type selection
      const airspeedType = el('airspeed-type').value;
      const kmh = Number(j[`${airspeedType}_kmh`]) || 0;
      const ms = Number(j[`${airspeedType}_ms`]) || 0;
      
      pushPoint(ts, kmh);
      el('v-airspeed').innerHTML = `${kmh.toFixed(2)}<span class="unit"> km/h</span>`;
      el('v-airspeed-ms').innerHTML = `${ms.toFixed(2)}<span class="unit"> m/s</span>`;
      
      // Temperature source selection
      const tempSource = el('temp-source').value;
      let tempVal = null;
      if (tempSource === 'PADS') tempVal = j.temperature_PADS;
      else if (tempSource === 'HIDS') tempVal = j.temperature_HIDS;
      else if (tempSource === 'PDUS') tempVal = j.temperature_PDUS;
      
      if (tempVal != null) el('v-temp').innerHTML = `${Number(tempVal).toFixed(2)}<span class="unit"> °C</span>`;
      else el('v-temp').innerHTML = `--<span class="unit"> °C</span>`;
      
      if (j.humidity_percent != null) el('v-hum').innerHTML = `${Number(j.humidity_percent).toFixed(1)}<span class="unit"> %</span>`;
      if (j.pressure_kpa != null) {
        el('v-press').innerHTML = `${Number(j.pressure_kpa).toFixed(2)}<span class="unit"> kPa</span>`;
        currentPressureKpa = Number(j.pressure_kpa);
        updateQNHDisplay();
      }
      
      el('status').textContent = '連線正常';
    }

    loadSeries();
    updateChartLabel();
    
    // Stream and polling management
    let eventSource = null;
    let pollInterval = null;

    function startStream() {
      if (eventSource) eventSource.close();
      if (pollInterval) clearInterval(pollInterval);
      
      eventSource = new EventSource('/api/stream');
      eventSource.onmessage = (e) => {
        try {
          const j = JSON.parse(e.data);
          updateDisplay(j);
        } catch(err) {
          console.error('Parse error:', err);
        }
      };
      eventSource.onerror = () => {
        el('status').textContent = '串流中斷，嘗試重連...';
      };
      el('status').textContent = '等待即時資料...';
    }

    function startPolling() {
      if (eventSource) eventSource.close();
      if (pollInterval) clearInterval(pollInterval);
      
      const rate = parseInt(el('update-rate').value) || 1000;
      pollInterval = setInterval(pollLive, rate);
    }

    function switchUpdateMode() {
      const mode = document.querySelector('input[name="update-mode"]:checked').value;
      if (mode === 'stream') {
        el('update-rate').disabled = true;
        startStream();
      } else {
        el('update-rate').disabled = false;
        startPolling();
      }
    }
    
    // Event listeners
    document.querySelectorAll('input[name="update-mode"]').forEach(radio => {
      radio.addEventListener('change', switchUpdateMode);
    });
    
    el('update-rate').addEventListener('change', () => {
      const mode = document.querySelector('input[name="update-mode"]:checked').value;
      if (mode === 'poll') startPolling();
    });
    
    el('airspeed-type').addEventListener('change', () => {
      updateChartLabel();
      loadSeries();
    });
    
    el('altitude-unit').addEventListener('change', () => {
      // Force refresh display to show new unit
      updateQNHDisplay();
      const mode = document.querySelector('input[name="update-mode"]:checked').value;
      if (mode === 'poll') pollLive();
    });
    
    el('time-range').addEventListener('change', updateTimeRange);
    el('x-axis-ticks').addEventListener('change', updateChartXAxisTicks);
    
    // QNH event listeners
    el('apply-qnh').addEventListener('click', applyQNH);
    el('qnh-pressure').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') applyQNH();
    });
    
    // Initialize
    updateChartLabel();
    updateTimeRange();
    
    // Start with stream mode
    switchUpdateMode();
  </script>
</body>
</html>
